openapi: 3.0.0
info:
  title: InternIQ API
  description: API specifications for the InternIQ AI-powered platform
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local development server
paths:
  /health:
    get:
      summary: Health Check
      tags: [System]
      responses:
        '200':
          description: OK
  
  # ─── Auth ───────────────────────────────────────────────────
  /auth/register:
    post:
      summary: Register a new user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '201': { description: Created }
          
  /auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Success }

  /auth/logout:
    post:
      summary: Logout user
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /auth/refresh-token:
    post:
      summary: Refresh access token
      tags: [Auth]
      responses:
        '200': { description: Success }

  /auth/verify-email:
    post:
      summary: Verify user email
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp: { type: string }
      responses:
        '200': { description: Success }

  /auth/forgot-password:
    post:
      summary: Request password reset
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200': { description: Success }

  /auth/reset-password:
    post:
      summary: Reset password
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Success }

  /auth/me:
    get:
      summary: Get current logged in user details
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /auth/google:
    get:
      summary: Google OAuth Login
      tags: [Auth]
      responses:
        '302': { description: Redirect to Google }

  /auth/google/callback:
    get:
      summary: Google OAuth Callback
      tags: [Auth]
      responses:
        '302': { description: Redirect to frontend }

  # ─── Resume ─────────────────────────────────────────────────
  /resume/upload:
    post:
      summary: Upload a resume
      tags: [Resume]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                resume:
                  type: string
                  format: binary
      responses:
        '200': { description: Success }

  /resume/ats-report:
    get:
      summary: Get ATS report for uploaded resume
      tags: [Resume]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /resume/reanalyze:
    post:
      summary: Reanalyze resume
      tags: [Resume]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /resume/status/{jobId}:
    get:
      summary: Get resume processing job status
      tags: [Resume]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: jobId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }

  # ─── Test ───────────────────────────────────────────────────
  /test/generate:
    post:
      summary: Generate a new test
      tags: [Test]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /test/my-test:
    get:
      summary: Get active test
      tags: [Test]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /test/run:
    post:
      summary: Run code
      tags: [Test]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /test/{testId}/mcq:
    post:
      summary: Submit MCQ answers
      tags: [Test]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: testId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }

  /test/{testId}/code:
    post:
      summary: Submit code answers
      tags: [Test]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: testId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }

  # ─── Recommendations ────────────────────────────────────────
  /recommendations:
    get:
      summary: Get recommendations for user
      tags: [Recommendations]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  # ─── Admin / Recruiter ──────────────────────────────────────
  /admin/stats:
    get:
      summary: Get platform stats
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /admin/ats-distribution:
    get:
      summary: Get ATS distribution
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /admin/skills-demand:
    get:
      summary: Get skills demand
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /admin/users:
    get:
      summary: Get users
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }

  /admin/users/{id}/block:
    patch:
      summary: Toggle block user
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }

  /admin/internships:
    get:
      summary: Get all internships
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Success }
    post:
      summary: Create new internship
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      responses:
        '201': { description: Created }

  /admin/internships/{id}:
    put:
      summary: Update internship
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }
    delete:
      summary: Delete internship
      tags: [Admin]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
